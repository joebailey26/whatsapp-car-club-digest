name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - { name: Typecheck, script: typecheck }
          - { name: Tests, script: test }
          # Bundles the Worker and builds the container image with Docker, without uploading either.
          - { name: Build, script: build }
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            browser/pnpm-lock.yaml
            marketplace-browser/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir browser install --frozen-lockfile
      - run: pnpm --dir marketplace-browser install --frozen-lockfile
      - run: pnpm run ${{ matrix.check.script }}
